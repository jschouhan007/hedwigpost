    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#0a0a0f;color:#e0e0e0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:24px}
        .offline-icon{font-size:5rem;margin-bottom:24px;opacity:.6}
        h1{font-size:2rem;margin-bottom:12px;background:linear-gradient(135deg,#8b5cf6,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
        p{color:#888;max-width:420px;line-height:1.7;margin-bottom:24px}
        button{padding:12px 28px;background:linear-gradient(135deg,#8b5cf6,#06b6d4);color:#fff;border:none;border-radius:8px;font-size:1rem;cursor:pointer;font-weight:600;transition:transform .2s}
        button:hover{transform:translateY(-2px)}
    </style>

    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2612722399801075" crossorigin="anonymous"></script>

<body>
    <div>
        <div class="offline-icon">📡</div>
        <h1>You're Offline</h1>
        <p>It looks like you've lost your internet connection. Don't worry — your cached content is still available. Reconnect to browse the latest articles.</p>
        <button onclick="window.location.reload()">Try Again ↻</button>
