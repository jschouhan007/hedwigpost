                            <input type="text" id="searchProducts" placeholder="Search products..."

                                onfocus="this.style.borderColor='var(--a-accent)'"
                                onblur="this.style.borderColor='var(--a-border)'" oninput="filterProducts()">
                        </div>
                        <select id="filterCategory" onchange="filterProducts()"
                            style="padding:9px 14px;border:1px solid var(--a-border);border-radius:var(--admin-radius);background:var(--a-bg-2);color:var(--a-text-0);font-family:var(--font-body);font-size:.86rem;outline:none;cursor:pointer">

                                <th>Badge</th>

    <script src="/admin/js/admin.js"></script>
    <script>
        let allProducts = [];

        document.addEventListener('DOMContentLoaded', () => { 
            checkAuth(); 
            loadDealCategories();
            loadProducts(); 
        });

        async function loadDealCategories() {
            try {
                const res = await authFetch('/api/deal-categories');
                const cats = await res.json();
                const select = document.getElementById('filterCategory');
                cats.forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c.slug;
                    opt.textContent = c.name;
                    select.appendChild(opt);
                });
            } catch (e) { console.error('Error loading deal categories', e); }
        }

        async function loadProducts() {
            try {
                const res = await authFetch('/api/products');
                allProducts = await res.json();
                filterProducts();
            } catch (e) {
                console.error('Error loading products', e);
                showToast('Failed to load products', 'error');
            }
        }

        function filterProducts() {
            const search = document.getElementById('searchProducts').value.toLowerCase();
            const category = document.getElementById('filterCategory').value;
            
            let filtered = allProducts;
            if (search) filtered = filtered.filter(p => (p.name || '').toLowerCase().includes(search));
            if (category) filtered = filtered.filter(p => p.category === category);

            document.getElementById('productsTable').innerHTML = filtered.map(p => `
            <tr>
                <td>
                    <div style="display:flex;align-items:center;gap:10px;">
                        ${p.image ? `<img src="${p.image}" style="width:40px;height:40px;border-radius:6px;object-fit:cover;">` : `<div style="width:40px;height:40px;border-radius:6px;background:var(--a-bg-hover);display:flex;align-items:center;justify-content:center;font-size:1.2rem;">📦</div>`}
                        <strong style="cursor:pointer;color:var(--a-text-0)" onclick="window.location.href='/admin/product-editor.html?id=${p.id}'">${truncate(p.name, 48)}</strong>
                    </div>
                </td>
                <td style="font-size:.82rem;color:var(--a-text-2)">${p.category}</td>
                <td style="font-family:var(--font-mono);font-size:.82rem;color:var(--a-green);font-weight:700;">${p.price}</td>
                <td>${p.badge ? `<span class="status-badge" style="background:var(--a-bg-3);color:var(--a-text-1)">${p.badge}</span>` : '<span style="color:var(--a-text-3)">-</span>'}</td>
                <td>${p.featured ? '⭐' : '-'}</td>
                <td class="action-btns">
                    <button class="action-btn" onclick="window.location.href='/admin/product-editor.html?id=${p.id}'">Edit</button>
                    <button class="action-btn" onclick="window.open('${p.affiliateLink || '/deals'}','_blank')">Link</button>
                    <button class="action-btn delete" onclick="deleteProduct('${p.id}')">Delete</button>
                </td>
            </tr>
        `).join('') || '<tr><td colspan="6" style="text-align:center;padding:40px;color:var(--a-text-3)">No products found</td></tr>';
        }

        async function deleteProduct(id) {
            if (!confirm('Are you sure you want to delete this product permanently?')) return;
            try {
                const res = await authFetch(`/api/products/${id}`, { method: 'DELETE' });
                if (!res.ok) throw new Error(`Server error: ${res.status}`);
                showToast('Product deleted ✓');
                loadProducts();
            } catch (e) {
                console.error('Delete failed:', e);
                showToast('Delete failed: ' + e.message, 'error');
            }
        }
    </script>
