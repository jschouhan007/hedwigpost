            <!-- Add Category -->
            <div class="admin-form" style="margin-bottom:24px;">
                <h3 style="margin-bottom:16px;">Add New Category</h3>
                <div style="display:flex;gap:12px;flex-wrap:wrap;">
                    <input type="text" id="catName" placeholder="Category name"
                        style="flex:1;min-width:200px;padding:10px 14px;border:1px solid var(--a-border);border-radius:var(--admin-radius);background:var(--a-bg-2);color:var(--a-text-0);font-family:inherit;">
                    <input type="text" id="catDesc" placeholder="Description (optional)"
                        style="flex:2;min-width:200px;padding:10px 14px;border:1px solid var(--a-border);border-radius:var(--admin-radius);background:var(--a-bg-2);color:var(--a-text-0);font-family:inherit;">
                    <button class="btn btn-primary" onclick="addCategory()"><svg viewBox="0 0 24 24" width="14"
                            height="14" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="12" y1="5" x2="12" y2="19" />

                        </svg> Add</button>

            </div>

            <div class="admin-table-wrap">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Slug</th>
                            <th>Description</th>
                            <th>Posts</th>
                            <th>Actions</th>

                    </thead>
                    <tbody id="categoriesTable"></tbody>
                </table>

    </div>

    <script src="/admin/js/admin.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => { checkAuth(); loadCategories(); });

        async function loadCategories() {
            // Fetch categories and real post counts simultaneously
            const [catsRes, statsRes] = await Promise.all([
                authFetch('/api/categories'),
                authFetch('/api/stats')
            ]);
            const cats = await catsRes.json();
            const stats = await statsRes.json();
            const realCounts = stats.categoryCounts || {};

            document.getElementById('categoriesTable').innerHTML = cats.map(c => `
            <tr>
                <td><strong>${c.name}</strong></td>
                <td><code style="background:var(--a-bg-3);padding:2px 8px;border-radius:4px;font-size:0.85rem;font-family:var(--font-mono)">${c.slug}</code></td>
                <td style="color:var(--a-text-2)">${c.description || '—'}</td>
                <td style="font-family:var(--font-mono);font-weight:600">${realCounts[c.name] || 0}</td>
                <td class="action-btns">
                    <button class="action-btn" onclick="window.open('/category/${c.slug}','_blank')">View</button>
                    <button class="action-btn delete" onclick="deleteCategory('${c.id}')">Delete</button>
                </td>
            </tr>
        `).join('') || '<tr><td colspan="5" style="text-align:center;padding:40px;color:var(--a-text-3)">No categories yet. Add one above.</td></tr>';
        }

        async function addCategory() {
            const name = document.getElementById('catName').value.trim();
            if (!name) { showToast('Enter a category name', 'error'); return; }
            await authFetch('/api/categories', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, description: document.getElementById('catDesc').value })
            });
            document.getElementById('catName').value = '';
            document.getElementById('catDesc').value = '';
            loadCategories();
            showToast('Category added ✓');
        }

        async function deleteCategory(id) {
            if (!confirm('Delete this category?')) return;
            await authFetch(`/api/categories/${id}`, { method: 'DELETE' });
            loadCategories();
            showToast('Category deleted');
        }
    </script>
