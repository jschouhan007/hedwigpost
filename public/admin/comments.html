<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">

    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="/admin/css/admin.css">
</head>

<body>
    <div class="admin-layout">
        <aside class="admin-sidebar" id="adminSidebar">
            <div class="sidebar-header">
                <img src="/img/logo.png" alt="HedwigPost" class="logo-icon" width="42" height="42">
                <div>
                    <h2>HedwigPost</h2><small>Command Center</small>
                </div>
            </div>
            <nav class="sidebar-nav">
                <div class="sidebar-nav-label">Content</div>
                <a href="/admin/dashboard.html"><span class="nav-icon"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg></span> Dashboard</a>
                <a href="/admin/editor.html"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></span> New Post</a>
                <a href="/admin/posts.html"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></span> All Posts</a>
                <a href="/admin/categories.html"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg></span> Categories</a>
                
                <div class="sidebar-nav-label" style="margin-top:16px;">Affiliate Deals</div>
                <a href="/admin/product-editor.html"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"></path></svg></span> Add Product</a>
                <a href="/admin/products.html"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4zM3 6h18M16 10a4 4 0 0 1-8 0"></path></svg></span> All Products</a>
                
                <div class="sidebar-nav-label" style="margin-top:16px;">Engagement</div>
                <a href="/admin/comments.html" class="active"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span> Comments <span class="badge" id="pendingBadge" style="display:none"></span></a>
                <div class="sidebar-nav-label">System</div>
                <a href="/admin/settings.html"><span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span> Settings</a>
                <div class="divider"></div>
                <a href="/" target="_blank"><span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg></span> View Site</a>
            </nav>
            <div class="sidebar-footer"><a href="#" onclick="logout()"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></span> Logout</a></div>
        </aside>

        <main class="admin-main">
            <div class="admin-header">
                <h1>💬 Comment Moderation</h1>
                <div style="display:flex;gap:10px;align-items:center;">
                    <select id="statusFilter" onchange="loadComments()" style="padding:8px 14px;border:1px solid var(--a-border);border-radius:8px;background:var(--a-bg-2);color:var(--a-text-0);font-size:.85rem;">
                        <option value="">All Comments</option>
                        <option value="pending">⏳ Pending</option>
                        <option value="approved">✅ Approved</option>
                        <option value="rejected">❌ Rejected</option>
                    </select>
                    <input type="text" id="searchInput" placeholder="Search comments..." oninput="loadComments()" style="padding:8px 14px;border:1px solid var(--a-border);border-radius:8px;background:var(--a-bg-2);color:var(--a-text-0);font-size:.85rem;width:200px;">
                    <button class="theme-toggle" onclick="toggleTheme()" id="themeToggle">🌙</button>
                </div>
            </div>

            <div class="admin-body">
                <!-- Stats Row -->
                <div class="stats-grid" id="commentStats" style="margin-bottom:20px;">
                    <div class="stat-card">
                        <div class="stat-icon yellow"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div>
                        <div class="stat-value" id="statTotal">—</div>
                        <div class="stat-label">Total Comments</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon purple"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div>
                        <div class="stat-value" id="statPending">—</div>
                        <div class="stat-label">Pending</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon green"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg></div>
                        <div class="stat-value" id="statApproved">—</div>
                        <div class="stat-label">Approved</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon red"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></div>
                        <div class="stat-value" id="statRejected">—</div>
                        <div class="stat-label">Rejected</div>
                    </div>
                </div>

                <!-- Comments Table -->
                <div class="admin-table-wrap">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Author</th>
                                <th>Comment</th>
                                <th>Post</th>
                                <th>Status</th>
                                <th>Date</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="commentsTable"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="/admin/js/admin.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            checkAuth();
            loadComments();
        });

        async function loadComments() {
            try {
                const status = document.getElementById('statusFilter').value;
                const search = document.getElementById('searchInput').value;
                let url = '/api/comments?';
                if (status) url += `status=${status}&`;
                if (search) url += `search=${encodeURIComponent(search)}&`;

                const res = await fetch(url);
                const data = await res.json();

                // Stats
                const allRes = await authFetch('/api/stats');
                const stats = await allRes.json();
                document.getElementById('statTotal').textContent = stats.totalComments || 0;
                document.getElementById('statPending').textContent = stats.pendingComments || 0;
                document.getElementById('statApproved').textContent = stats.approvedComments || 0;
                document.getElementById('statRejected').textContent = (stats.totalComments || 0) - (stats.pendingComments || 0) - (stats.approvedComments || 0);

                const badge = document.getElementById('pendingBadge');
                if (stats.pendingComments > 0) {
                    badge.textContent = stats.pendingComments;
                    badge.style.display = 'inline-flex';
                }

                // Table
                const tb = document.getElementById('commentsTable');
                if (data.comments.length === 0) {
                    tb.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:40px;color:var(--a-text-3)">No comments found</td></tr>';
                    return;
                }

                tb.innerHTML = data.comments.map(c => `
                    <tr>
                        <td>
                            <div style="font-weight:600;color:var(--a-text-0);font-size:.85rem;">${escHtml(c.name)}</div>
                            <div style="font-size:.72rem;color:var(--a-text-3);font-family:var(--font-mono)">${escHtml(c.email || 'no email')}</div>
                        </td>
                        <td style="max-width:300px;">
                            <div style="font-size:.85rem;color:var(--a-text-1);line-height:1.5;word-break:break-word;">${escHtml(truncate(c.comment, 120))}</div>
                        </td>
                        <td>
                            <a href="/post/${c.postSlug}" target="_blank" style="font-size:.8rem;color:var(--a-accent);text-decoration:none;">${escHtml(truncate(c.postTitle || c.postSlug, 30))}</a>
                        </td>
                        <td><span class="status-badge ${c.status}">${c.status}</span></td>
                        <td style="font-family:var(--font-mono);font-size:.78rem;color:var(--a-text-3)">${formatDate(c.createdAt)}</td>
                        <td class="action-btns">
                            ${c.status !== 'approved' ? `<button class="action-btn" onclick="updateComment('${c.id}','approved')" style="color:var(--a-green)">✓ Approve</button>` : ''}
                            ${c.status !== 'rejected' ? `<button class="action-btn" onclick="updateComment('${c.id}','rejected')" style="color:var(--a-yellow)">✕ Reject</button>` : ''}
                            <button class="action-btn delete" onclick="deleteComment('${c.id}')">🗑 Delete</button>
                        </td>
                    </tr>
                `).join('');
            } catch (e) {
                console.error('Load comments error:', e);
            }
        }

        function escHtml(str) {
            const div = document.createElement('div');
            div.textContent = str || '';
            return div.innerHTML;
        }

        async function updateComment(id, status) {
            await authFetch(`/api/comments/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status })
            });
            showToast(`Comment ${status} ✓`);
            loadComments();
        }

        async function deleteComment(id) {
            if (!confirm('Delete this comment permanently?')) return;
            await authFetch(`/api/comments/${id}`, { method: 'DELETE' });
            showToast('Comment deleted');
            loadComments();
        }
    </script>
</body>
</html>
